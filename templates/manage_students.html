<h2>Manage Students</h2>

<table border="1">
<tr>
    <th>Name</th>
    <th>Reg No</th>
    <th>Action</th>
</tr>

{% for s in students %}
<tr>
    <td>{{ s.name }}</td>
    <td>{{ s.regno }}</td>
    <td>
        <a href="/delete_student/{{ s.id }}">Delete</a>
    </td>
</tr>
{% endfor %}
</table>
